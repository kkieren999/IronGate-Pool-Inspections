<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Book a Reinspection | IronGate Pool Inspections</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="section">
    <div class="container">
      <a href="/">IronGate Pool Inspections</a>
      <h1>Book your pool safety reinspection</h1>
      <p>Choose an available visit once the work in your non-conformity notice is complete.</p>
      <p id="reinspection-price"></p>
      <p id="reinspection-status" role="status" aria-live="polite">Checking your private link…</p>
      <form id="reinspection-form" class="booking-form" hidden>
        <label for="reinspection-date">Available date</label>
        <select id="reinspection-date" required></select>
        <label for="reinspection-time">Available time (Brisbane time)</label>
        <select id="reinspection-time" required></select>
        <button class="btn btn-primary" type="submit">Confirm reinspection</button>
      </form>
      <a id="reinspection-resume" class="btn btn-primary" hidden>Resume secure payment</a>
      <p>Need help? Call <a href="tel:0481442260">0481 442 260</a>.</p>
    </div>
  </main>
  <script type="module" src="/js/reinspection-booking.js"></script>
</body>
</html>
