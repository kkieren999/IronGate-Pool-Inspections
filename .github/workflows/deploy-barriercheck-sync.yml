name: Deploy BarrierCheck Booking Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions-barriercheck/**"
      - "firebase-barriercheck.json"
      - ".github/workflows/deploy-barriercheck-sync.yml"

concurrency:
  group: firebase-barriercheck-sync-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions-barriercheck

      - name: Verify function syntax
        run: npm run lint
        working-directory: functions-barriercheck

      - name: Prepare Firebase credentials
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /home/runner/firebase-service-account.json
          test -s /home/runner/firebase-service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy BarrierCheck booking sync trigger
        run: npx --yes firebase-tools@15.22.3 deploy --config firebase-barriercheck.json --only functions:barriercheck:syncBarrierCheckInspection --project irongate-pool-inspection-256b4 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-service-account.json
