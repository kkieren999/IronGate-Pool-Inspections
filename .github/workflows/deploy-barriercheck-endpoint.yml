name: Deploy BarrierCheck Import Endpoint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-barriercheck-endpoint.yml"

concurrency:
  group: barriercheck-import-endpoint-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IronGate
        uses: actions/checkout@v6

      - name: Checkout BarrierCheck production source
        uses: actions/checkout@v6
        with:
          repository: kkieren999/BarrierCheck
          ref: main
          path: barriercheck

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install BarrierCheck function dependencies
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: barriercheck/functions

      - name: Verify BarrierCheck functions syntax
        run: npm run lint
        working-directory: barriercheck/functions

      - name: Prepare Firebase credentials
        shell: bash
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > /home/runner/firebase-service-account.json
          node -e 'const fs=require("fs"); const p="/home/runner/firebase-service-account.json"; const j=JSON.parse(fs.readFileSync(p,"utf8")); if(!j.client_email || !j.private_key) throw new Error("Invalid Firebase service account JSON"); console.log("Firebase credential loaded for", j.client_email);'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy BarrierCheck IronGate import endpoint
        run: npx --yes firebase-tools@15.22.3 deploy --only functions:createIronGateInspection --project barriercheck-32290 --non-interactive
        working-directory: barriercheck
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-service-account.json
