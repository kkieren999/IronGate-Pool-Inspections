name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare deploy folder
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          cp -a irongate_rebuilt_site_20260623_093017/. public/
          cp CNAME public/CNAME

          # Guarantee the published booking flow uses the advertised $149 price.
          find public -type f \( -name '*.html' -o -name '*.js' -o -name '*.txt' \) -print0 \
            | xargs -0 sed -i 's/24900/14900/g; s/\$249/\$149/g; s/PSI 000000/PS15616387/g'

          # Bust browser/CDN caches for scripts that can write the booking price at runtime.
          sed -i 's#src="js/booking.js[^\"]*"#src="/js/booking.js?v=20260807-149"#g' public/booking/index.html
          sed -i 's#src="js/booking-stripe.js[^\"]*"#src="/js/booking-stripe.js?v=20260807-149"#g' public/booking/index.html

      - name: Verify published booking price
        run: |
          python - <<'PY'
          from pathlib import Path

          booking_html = Path('public/booking/index.html').read_text(encoding='utf-8')
          booking_js = Path('public/js/booking.js').read_text(encoding='utf-8')
          stripe_js = Path('public/js/booking-stripe.js').read_text(encoding='utf-8')
          combined = '\n'.join((booking_html, booking_js, stripe_js))

          checks = {
              'booking HTML contains the $149 price notice':
                  'id="booking-price-notice"' in booking_html and '$149' in booking_html,
              'booking JavaScript uses 14900 cents':
                  'const inspectionPriceCents = 14900;' in booking_js,
              'Stripe-facing JavaScript displays $149':
                  '$149' in stripe_js,
              'booking scripts use cache-busting URLs':
                  '/js/booking.js?v=20260807-149' in booking_html
                  and '/js/booking-stripe.js?v=20260807-149' in booking_html,
              'no stale $249 display remains': '$249' not in combined,
              'no stale 24900-cent amount remains': '24900' not in combined,
          }

          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(f"{'PASS' if passed else 'FAIL'}: {name}")

          if failed:
              raise SystemExit('Published booking validation failed: ' + '; '.join(failed))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
