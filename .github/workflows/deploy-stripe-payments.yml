name: Deploy Stripe Payments Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions-payments/**"
      - "firebase.json"
      - ".github/workflows/deploy-stripe-payments.yml"

concurrency:
  group: firebase-stripe-payments-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund
        working-directory: functions-payments

      - name: Prepare Firebase credentials
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /home/runner/firebase-service-account.json
          test -s /home/runner/firebase-service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Stripe payments functions
        shell: bash
        run: |
          # The CLI can report a post-deployment artifact-policy error after every function is updated.
          # Accept that specific outcome ONLY when all three function updates are confirmed in this run.
          log_file="$(mktemp)"
          set -uo pipefail
          set +e
          npx --yes firebase-tools@15.22.3 deploy --only functions:payments:createBookingCheckoutSession,functions:payments:createAgencyInvoiceBooking,functions:payments:stripeWebhook,functions:payments:adminMoveBooking,functions:payments:adminCancelBooking,functions:payments:adminRefundBooking,functions:payments:adminReconcileBookingRefunds,functions:payments:adminReconcileBookingBilling,functions:payments:adminIssueBookingInvoice --project irongate-pool-inspection-256b4 --non-interactive 2>&1 | tee "$log_file"
          deploy_status=${PIPESTATUS[0]}
          set -e
          if [ "$deploy_status" -eq 0 ]; then
            exit 0
          fi
          if grep -Fq "Functions successfully deployed but could not set up cleanup policy" "$log_file"; then
            for name in createBookingCheckoutSession createAgencyInvoiceBooking stripeWebhook adminReconcileBookingBilling adminIssueBookingInvoice; do
              if ! grep -F "functions[payments:${name}(us-central1)]" "$log_file" | grep -Fq "Successful update operation."; then
                echo "::error::No successful update confirmation for ${name}; deployment failed."
                exit "$deploy_status"
              fi
            done
            echo "::warning::All required Stripe/payment functions were updated, but artifact cleanup policy setup failed. Configure Artifact Registry retention with an appropriately authorised service account; see docs/DEPLOYMENT.md."
            exit 0
          fi
          exit "$deploy_status"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /home/runner/firebase-service-account.json
